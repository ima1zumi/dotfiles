# 256colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
# 描画をまとめて反映させ、他の pane の更新でカーソルがちらつかないようにする（Alacritty 0.13+）
set -as terminal-features ",xterm-256color:sync"
set -g default-terminal "tmux-256color"

# enable mouse
set-option -g mouse on

# vi mode
set-window-option -g mode-keys vi

# Prefix+v でコピーモード開始
bind-key v copy-mode
# vでマーク開始 or [space]
bind-key -T copy-mode-vi v send-keys -X begin-selection
# yでヤンク or [Enter]
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
# C-d で page-down, C-u で page-up
bind-key -T copy-mode-vi C-d send-keys -X page-down
bind-key -T copy-mode-vi C-u send-keys -X page-up

# 前のウインドウに移動
bind-key l next-window
bind-key h previous-window
# sidebar は縦に並ぶので j/k でも前後の window へ移動できるようにする
bind-key j next-window
bind-key k previous-window

# prefixの変更
set -g prefix C-q
unbind C-b
# C-q を2回押すと Neovim などに C-q が送られるようにする
bind C-q send-prefix

# ウィンドウ履歴の最大行数
set-option -g history-limit 100000

# ステータスバーをトップに配置する
set-option -g status-position top
# ステータスバーの色を設定する
set-option -g status-bg "colour0"
# status line の文字色を指定する
set-option -g status-fg "colour250"
# status-right のフォーマットを指定する。
set-option -g status-right "#[fg=colour250,bg=colour0] %m/%d %H:%M#[default]"
# カレントウィンドウの window-status のフォーマットを指定する
set-window-option -g window-status-current-format "#[fg=colour250,bg=colour236,bold] #I: #W #[default]"

# escを待たない
# https://ymizushi.hateblo.jp/entry/2017/08/27/222932
set -s escape-time 10

# ペインの間の色を変える
set -g pane-active-border-style fg=colour111,bg=black

# Claude Code / Codex の状態を window 名と status-right に出す（~/.bin/agent-status）
# ▲ 入力待ち / ✓ 見ていない間に終わった / ● 作業中 / · 待機中
set -g status-interval 5
set -g status-right-length 80
set-option -g status-right "#(~/.bin/agent-status refresh)#[fg=colour250,bg=colour0] %m/%d %H:%M#[default]"
# 詳細は sidebar で見るので、上のバーは番号とアイコンだけにする（今の window だけ短いラベルを付ける）
set-window-option -g window-status-format " #I#{?@agent_icon,#{@agent_icon},:#{=/6/…:window_name}} "
set-window-option -g window-status-current-format "#[fg=colour250,bg=colour236,bold] #I#{?@agent_icon,#{@agent_icon}#{=/12/…:@agent_label},:#{=/12/…:window_name}} #[default]"
# prefix + a で一覧から選んで移動する
bind-key a display-popup -E -w 80% -h 80% "~/.bin/agent-status pick"
set -g @agent_sidebar_width 32
# prefix + b でこの window の左に sidebar を開閉する。prefix + B は全 window（新しい window にも開く）
bind-key b run-shell -b "~/.bin/agent-status toggle '#{window_id}'"
bind-key B run-shell -b "~/.bin/agent-status toggle '#{window_id}' --all"
set-hook -g after-new-window 'run-shell -b "~/.bin/agent-status ensure #{window_id}"'
